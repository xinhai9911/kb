# 最小 nginx.conf —— nginx-module-examples 一键启动配置
#
# 用法（动态模块，nginx 已带 --with-compat 编译）：
#   nginx -p $PWD -c nginx.conf        # 用系统 nginx 加载 modules/*.so
# 或静态二进制：
#   ./build/nginx -p $PWD -c nginx.conf
#
# 演示四个模块的接线：
#   /hello        -> hello 模块（Handler，返回文本）
#   /             -> proxy 到 backend（受 xfilter 影响，加响应头）
#   /myup         -> myupstream 模块（Upstream，自管后端协议）
#   backend 上游   -> mylb 模块（负载均衡器，轮转选节点）

# error_log 开 debug 便于看模块日志（排错时）
error_log  logs/error.log  notice;
pid        logs/nginx.pid;

# 单 worker + 前台，配合 gdb 调试（见 README §调试）
worker_processes  1;
daemon            off;
master_process    off;

events {
    worker_connections  1024;
}

http {
    # 加载本工程编译出的动态模块
    load_module modules/ngx_http_hello_module.so;
    load_module modules/ngx_http_xfilter_module.so;
    load_module modules/ngx_http_myupstream_module.so;
    load_module modules/ngx_http_mylb_module.so;

    access_log  logs/access.log;

    # 负载均衡器：在 upstream 内启用 mylb（简单轮转）
    upstream backend {
        mylb;
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
    }

    server {
        listen 8080;

        # Handler 模块
        location = /hello {
            hello;
        }

        # 走 proxy，响应会被 xfilter 加 X-Powered-By 头
        location / {
            proxy_pass http://backend;
        }

        # Upstream 模块（content 阶段自管后端协议）
        location /myup {
            myupstream;
        }
    }
}

# 说明：
# - /myup 的 myupstream 模块内部用 proxy_pass 的地址做后端寻址（演示用 127.0.0.1:9000），
#   后端只需在首行返回 "OK" 即被判定 200，否则 502。可用简单 nc 监听模拟：
#     while true; do printf 'OK\n' | nc -l -p 9000; done
# - backend 的 9001/9002 需要真实上游服务，或临时用 nc 起两个回显服务看 mylb 轮转。
