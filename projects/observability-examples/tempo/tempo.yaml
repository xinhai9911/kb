# Tempo 配置（最小，接收 OTLP trace）
# 对应 [[entities/可观测性接入实战]] §2、[[concepts/可观测性工程]] §2
#
# otel-collector 的 traces exporter 可指向 tempo:4317（OTLP）。

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http: {}

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
    block:
      bloom_filter_bits_per_key: 16

compactor:
  compaction:
    block_retention: 1h

metrics_generator:
  registry:
    external_labels:
      source: tempo
