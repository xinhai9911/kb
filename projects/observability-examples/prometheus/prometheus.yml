# Prometheus 抓取配置
# 对应 [[entities/可观测性接入实战]] §3、[[concepts/可观测性工程]] §3
#
# 从 otel-collector 的 :8889 拉取 metrics（RED 指标：http_requests_total / http_request_duration_seconds）

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # 若 app 直接暴露 /metrics（本例经 collector），可加：
  # - job_name: order-app
  #   static_configs:
  #     - targets: ["app:8080"]
