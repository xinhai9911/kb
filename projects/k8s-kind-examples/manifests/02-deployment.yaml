# Deployment：无状态应用声明式发布。演示探针、ConfigMap 注入、滚动更新。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: k8s-kind-examples/web:v1   # 本地镜像，由 kind load 注入
        imagePullPolicy: IfNotPresent      # 本地注入的镜像用 IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        # 从 ConfigMap 注入配置
        - name: GREETING
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: GREETING
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: APP_VERSION
        # Pod 名：用于验证负载均衡（每次访问看到不同 Pod）
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits:   {cpu: 200m, memory: 128Mi}
        # startupProbe：慢启动应用保护（未通过前不跑 liveness/readiness）
        startupProbe:
          httpGet: {path: /healthz, port: http}
          failureThreshold: 30
          periodSeconds: 2
        # readinessProbe：失败则从 Service 摘流（不重启）
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 2
          periodSeconds: 5
        # livenessProbe：失败则重启容器
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
