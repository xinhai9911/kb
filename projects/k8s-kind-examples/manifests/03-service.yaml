# Service：稳定访问入口。ClusterIP 类型，Pod 会死会重建，Service 不变。
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector:
    app: web        # 靠 label 选后端 Pod（由 EndpointSlice 控制器维护）
  ports:
  - name: http
    port: 80        # 客户端访问的端口
    targetPort: http  # 转发到 Pod 的 8080
  type: ClusterIP
