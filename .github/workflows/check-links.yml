name: Check KB Links

on:
  push:
    branches: [main, master]
    paths:
      - '**.md'
      - 'scripts/check-links.js'
      - '.github/workflows/check-links.yml'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check-links.js'
      - '.github/workflows/check-links.yml'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check wikilinks & markdown links
        run: node scripts/check-links.js
        # 如需同时校验外链可达性（会发起网络请求、更慢），取消下一行注释：
        # run: node scripts/check-links.js --check-external --timeout 8000
